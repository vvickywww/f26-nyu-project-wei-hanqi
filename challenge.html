<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Presentation Challenge</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- PAGE HEADER -->
    <header>
      <h1>Practice makes perfect!</h1>
      <p>Time left: <span>15:00</span></p>
    </header>

    <!-- MAIN CONTENT -->
    <main>
      <div class="practice-grid">
        <!-- LEFT CARD: CURRENT SLIDE SECTION -->
        <section class="practice-card">
          <h2 id="slide-title">Slide 1</h2>
          <p id="slide-description">Current slide content appears here.</p>
          <p id="slide-count" class="progress-text">Slide 1 of 15</p>

          <!-- Next Slide Button -->
          <button id="next-button" type="button" class="btn">Next Slide</button>

          <!-- Status Message -->
          <p id="message" class="message" role="status"></p>
        </section>

        <!-- RIGHT CARD: LIVE CHALLENGE POPUP & SHUFFLE -->
        <section class="practice-card setting-backdrop">
          <div class="challenge-popup">
            <span class="badge">Live Interruption</span>
            <p id="challenge-count" class="progress-text"></p>

            <!-- render() draws the active challenge card inside here -->
            <div id="challenge-display"></div>

            <!-- Shuffle Button -->
            <button id="shuffle-button" type="button" class="btn btn-secondary">
              Shuffle Challenge
            </button>
          </div>
        </section>
      </div>

      <!-- END PRACTICE -->
      <section class="end-section">
        <a href="report.html" class="btn btn-secondary">End Practice</a>
      </section>
    </main>

    <!-- Load Assignment 6 data array first, then main script -->
    <script src="challenge.js"></script>
    <script src="script.js"></script>
  </body>
</html>
